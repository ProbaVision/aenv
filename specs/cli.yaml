- command: aenv -h
  description: Display help information about agent env setup.
- command: aenv agents
  description: agents home folder, agents.md, claude.md, and agent cli hidden subfolders, .claude and .agent.
  output-format: yaml
  output-sample:
    - path: $HOME/.claude
      agent: claude code
    - path: $HOME/.copilot
      agent: copilot 
    - path: $HOME/agents.md
      agent: open source
- command: aenv tools
  description: commonly used tools for agent cli, such as jq, yq, timeout, grep, sed, awk.
  output-format: yaml
  output-sample:
    - name: jq
      version: 1.6
    - name: yq
      version: 4.30.8
    - name: timeout
      version: Missing
- command: aenv completion
  description: cobra built in command to generate shell completion scripts for zsh, bash, and fish.